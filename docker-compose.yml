# Local dev harness for Mindful Import. WordPress on http://localhost:8089 (admin / admin after dev/seed.sh).
#   docker compose up -d && dev/seed.sh && dev/smoke.sh
name: mindful-import-dev

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', 'http://localhost:8089');
    define('WP_SITEURL', 'http://localhost:8089');
    define('DISABLE_WP_CRON', false);
    // Plugin notices go to wp-content/debug.log, never into JSON responses (where they would also break status codes).
    define('WP_DEBUG_DISPLAY', false);
    define('WP_DEBUG_LOG', true);
    define('WP_MEMORY_LIMIT', '256M');
    define('WP_ENVIRONMENT_TYPE', 'local');
    // Import registration posts to the mock receiver in dev/test-cpt.php. `wordpress` is the compose service
    // name, reachable from the wordpress and cli containers (localhost:8089 is host-side only). http is
    // accepted only because the environment type is local.
    define('MINDFUL_IMPORT_REGISTRATION_URL', 'http://wordpress/?rest_route=/mi-dev/v1/registrations');

x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  - ./plugin:/var/www/html/wp-content/plugins/mindful-import
  - ./dev/test-cpt.php:/var/www/html/wp-content/mu-plugins/test-cpt.php

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:latest
    ports:
      - "127.0.0.1:8089:80"
    environment: *wp-env
    volumes: *wp-volumes
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    entrypoint: ["wp"]
    environment: *wp-env
    # Same mounts as wordpress, plus the seed fixtures (read-only) for `wp media import`.
    volumes:
      - wp_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/mindful-import
      - ./dev/test-cpt.php:/var/www/html/wp-content/mu-plugins/test-cpt.php
      - ./dev/fixtures:/fixtures:ro
    depends_on:
      - wordpress

volumes:
  wp_data:
  db_data:
